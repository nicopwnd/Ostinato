
name: Tests

on:
  push:
  pull_request:

# Blocking: the Gradle 4.9 wrapper jar is now committed (gradle/wrapper), so
# ./gradlew test actually runs on JDK 8 instead of failing to launch.
# TenorClef additionally gates legacy via its own :1.16.1:compileJava with a staged jar.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Executing tests
      run: ./gradlew test
