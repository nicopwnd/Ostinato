# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Build (fabric) with Gradle
      run: ./gradlew build -Pbaritone.fabric_build

    # Known-broken on 1.16.1 independent of CI: gradle.properties hardcodes
    # baritone.fabric_build=true, so a forge build compiles against intermediary
    # (net.minecraft.class_*) names and ProGuard can't resolve them against the SRG
    # client jar ("can't find superclass ... net.minecraft.class_*"). Kept visible but
    # non-blocking so the default/fabric builds and artifact upload still gate the job.
    - name: Build (forge) with Gradle
      continue-on-error: true
      run: ./gradlew build -Pbaritone.forge_build

    - name: Archive Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Artifacts
        path: dist/
        
    - name: Archive mapping.txt
      uses: actions/upload-artifact@v4
      with:
        name: Mappings
        path: build/tmp/proguard/mapping.txt
